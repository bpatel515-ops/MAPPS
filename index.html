<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting&hellip;</title>
<!-- Instant redirect for browsers -->
<meta http-equiv="refresh" content="0; url=https://coachbpatel.com/mapps">
<!-- Tell search engines this page has permanently moved -->
<link rel="canonical" href="https://coachbpatel.com/mapps">
<script>
  // Preserve any sub-path or query string the visitor arrived with.
  // e.g. mapps.coachbpatel.com/exercise-library  ->  coachbpatel.com/exercise-library
  (function () {
    var dest = "https://coachbpatel.com/mapps";
    var path = window.location.pathname.replace(/^\/+/, "");   // strip leading slash
    var search = window.location.search || "";
    if (path && path.toLowerCase() !== "index.html") {
      dest = "https://coachbpatel.com/" + path.replace(/\.html$/i, "");
    }
    window.location.replace(dest + search);
  })();
</script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0E1B2B;color:#fff;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;}
  a{color:#1D9E75;}
</style>
</head>
<body>
  <div>
    <p>This page has moved.</p>
    <p><a href="https://coachbpatel.com/mapps">Continue to coachbpatel.com/mapps &rarr;</a></p>
  </div>
</body>
</html>
